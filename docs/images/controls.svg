<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="controls-title controls-desc">
<title id="controls-title">三个控件的位置与用途</title>
<desc id="controls-desc">合成的热水器磁贴面板。编号一为智能温水开关，编号二为速热增容开关，编号三为变速选择。电源和当前温度在上方，目标温度在下方。</desc>
<rect width="900" height="650" rx="20" fill="#f5f5f7"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
<text x="36" y="45" font-size="17" fill="#6e6e73">面板示意 · 演示状态</text>
<rect x="112" y="73" width="676" height="459" rx="18" fill="#191f26"/>
<text x="140" y="113" font-size="22" font-weight="600" fill="#f5f5f7">热水器</text>
<g fill="#29313b"><rect x="136" y="134" width="306" height="74" rx="12"/><rect x="458" y="134" width="306" height="74" rx="12"/><rect x="136" y="224" width="306" height="112" rx="12"/><rect x="458" y="224" width="306" height="112" rx="12"/><rect x="136" y="352" width="628" height="86" rx="12"/><rect x="136" y="454" width="628" height="55" rx="12"/></g>
<g font-size="18" fill="#f5f5f7" font-weight="600"><text x="154" y="164">热水器</text><text x="476" y="164">当前水温</text><text x="154" y="254">智能温水</text><text x="476" y="254">速热增容</text><text x="154" y="381">变速选择</text><text x="154" y="488">设定温度</text></g>
<g font-size="16" fill="#b9c5cf"><text x="154" y="190">开启</text><text x="476" y="190">演示：40 °C</text><text x="154" y="280">开启</text><text x="476" y="280">关闭</text><text x="662" y="488">40 °C</text></g>
<rect x="154" y="295" width="270" height="25" rx="8" fill="#275e56"/><rect x="289" y="295" width="135" height="25" rx="8" fill="#3bd4b4"/>
<rect x="476" y="295" width="270" height="25" rx="8" fill="#414b57"/><rect x="476" y="295" width="135" height="25" rx="8" fill="#88939d"/>
<rect x="154" y="394" width="592" height="30" rx="7" fill="#394653"/><text x="166" y="415" font-size="15" fill="#f5f5f7">智能温水中</text><path d="m716 406 6 6 6-6" fill="none" stroke="#c1cbd3" stroke-width="2"/>
<g fill="#0066cc"><circle cx="111" cy="240" r="20"/><circle cx="788" cy="240" r="20"/><circle cx="111" cy="372" r="20"/></g>
<g fill="#fff" font-size="18" font-weight="600" text-anchor="middle"><text x="111" y="247">1</text><text x="788" y="247">2</text><text x="111" y="379">3</text></g>
<g font-size="17" fill="#1d1d1f"><text x="112" y="573">1　智能温水</text><text x="348" y="573">2　速热增容</text><text x="582" y="573">3　变速选择</text></g>
<g font-size="15" fill="#6e6e73"><text x="112" y="603">日常中温保温</text><text x="348" y="603">关闭后回到温水</text><text x="582" y="603">选择低、中、高档</text></g>
</g></svg>
